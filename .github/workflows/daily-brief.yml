name: Daily Market Brief

on:
  schedule:
    - cron: "30 1 * * 1-5"   # 01:30 UTC = 07:00 AM IST, Mon-Fri
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate brief
        run: python generate_brief.py

      - name: Commit updated page
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Daily brief $(date -u +%F)" || echo "No changes"
          git push
